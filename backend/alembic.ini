# Alembic config. Run from backend/ (the container's /code): `make migrate`.
# The database URL is NOT set here — env.py reads it from app.core.config,
# so it always matches the app's own settings / .env.

[alembic]
script_location = app/db/migrations
# Makes `import app...` work from env.py
prepend_sys_path = .
# Revision files: 0001_initial_schema.py, 0002_..., in creation order
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# logging reads this section raw — single % here (unlike [alembic] above)
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
