
name: CI

# Runs on every PR into dev or prod, and on pushes to those branches.
on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit subjects and PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/check-conventional-commits.sh

  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      # DATA-06 live-ingestion tests run against a throwaway database (tests/conftest.py).
      TEST_DATABASE_URL: postgresql+psycopg://smokesense:smokesense@localhost:5432/smokesense_test
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: smokesense
          POSTGRES_PASSWORD: smokesense
          POSTGRES_DB: smokesense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smokesense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      # Download ML-01 models from the published GitHub Release.
      # The models are excluded from Git and required by integration tests.
      - name: Download and verify ML-01 model artifacts
        env:
          RELEASE_TAG: ml01-baselines-v1.0.0
        run: |
          set -euo pipefail

          BASE_URL="https://github.com/victornguyen247/SmokeSense-wildfire-smoke-prediction/releases/download/${RELEASE_TAG}"
          ARCHIVE="${RELEASE_TAG}.zip"
          CHECKSUM="${RELEASE_TAG}.sha256"

          mkdir -p "$RUNNER_TEMP/ml01"
          cd "$RUNNER_TEMP/ml01"

          # Download the model package and checksum.
          curl --fail --location --retry 3 \
            -o "$ARCHIVE" "$BASE_URL/$ARCHIVE"

          curl --fail --location --retry 3 \
            -o "$CHECKSUM" "$BASE_URL/$CHECKSUM"

          # Verify package integrity before extraction.
          sha256sum --check "$CHECKSUM"

          # Extract the models into the directory expected by inference.
          python - "$ARCHIVE" "$GITHUB_WORKSPACE/backend/data/models/ml01_baselines" <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          archive_path = Path(sys.argv[1])
          destination = Path(sys.argv[2]).resolve()
          destination.mkdir(parents=True, exist_ok=True)

          allowed_files = {
              "models/decision_tree_1h.joblib",
              "models/decision_tree_3h.joblib",
              "models/decision_tree_6h.joblib",
              "models/decision_tree_12h.joblib",
              "models/decision_tree_24h.joblib",
              "model_metadata.json",
              "validation_results.csv",
              "test_results.csv",
              "test_classification.csv",
          }

          with ZipFile(archive_path) as archive:
              names = set(archive.namelist())

              if names != allowed_files:
                  raise ValueError(
                      f"Unexpected artifact contents: {names ^ allowed_files}"
                  )

              for member in archive.infolist():
                  target = (destination / member.filename).resolve()

                  if not target.is_relative_to(destination):
                      raise ValueError("Unsafe ZIP path")

                  if member.is_dir():
                      continue

                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(member))

          for horizon in (1, 3, 6, 12, 24):
              model = (
                  destination
                  / "models"
                  / f"decision_tree_{horizon}h.joblib"
              )

              if not model.is_file():
                  raise FileNotFoundError(model)

          print("ML-01 artifacts verified and installed.")
          PY

      - name: Test (pytest)
        run: pytest

  api-spec:
    name: API spec (OpenAPI + fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/api/requirements.txt

      - name: Install dependencies
        run: pip install -r docs/api/requirements.txt

      - name: Validate spec and fixtures
        run: python docs/api/validate.py

      - name: Check fixtures match gen_fixtures.py
        run: |
          python docs/api/gen_fixtures.py "$RUNNER_TEMP/fixtures"
          diff -r "$RUNNER_TEMP/fixtures" docs/api/fixtures

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build
        run: npm run build

  compose:
    name: Docker Compose (db + redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create env files from templates
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env

      - name: Start Postgres + Redis
        run: docker compose up -d --wait db redis

      - name: Verify PostGIS extension is enabled
        run: docker compose exec -T db psql -U smokesense -d smokesense -c "SELECT postgis_full_version();"

      - name: Verify Redis responds
        run: docker compose exec -T redis redis-cli ping

      - name: Tear down
        if: always()
        run: docker compose down -v
