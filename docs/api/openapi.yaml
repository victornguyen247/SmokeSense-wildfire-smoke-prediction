openapi: 3.1.0
info:
  title: SmokeSense API
  version: 1.0.0-draft
  summary: Wildfire smoke (PM2.5) forecasts, fires and sensor readings for California.
  description: |
    MVP contract that the frontend and backend both build against (PM-02).
    Conventions (timestamps, units, errors, versioning, `method` / `source`) are in
    [docs/api.md](../api.md). Forecast semantics follow the PM-03 serving contract
    (docs/ml/serving-contract.md): the model runs at AirNow monitors (Stage A) and grid
    cells are interpolated from them (Stage B).

    Every example response lives in `docs/api/fixtures/` and is validated against this
    spec in CI (`docs/api/validate.py`).
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8000
    description: Local development

# Public, read-only API: no authentication in v1.
security: []

tags:
  - name: forecast
    description: PM2.5 forecasts at grid cells, points and monitors
  - name: fires
    description: Satellite fire detections (NASA FIRMS)
  - name: observations
    description: Latest sensor readings (AirNow, PurpleAir)
  - name: meta
    description: Model, freshness, AQI legend and health

paths:
  /api/v1/grid/cells:
    get:
      tags: [forecast]
      operationId: getGridCells
      summary: GEO-02 grid cell polygons (static; fetch once and cache)
      description: |
        One Polygon feature per GEO-02 grid cell (`forecast_points.cell_geom`): ~3,000
        squares of 12.5 km in EPSG:3310, clipped to California and served in WGS84.
        A square split by the coastline is several cells (`-p00`, `-p01`, …).

        The grid only changes when GEO-02 is regenerated, which changes `grid_key`. The
        response is sent with `Cache-Control: public, max-age=86400` and an `ETag`;
        compare `grid_key` with `/meta` to know when to refetch.
      parameters:
        - $ref: "#/components/parameters/BboxOptional"
      responses:
        "200":
          description: Grid cells intersecting the bbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GridCellCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/OutOfScope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/forecast/grid:
    get:
      tags: [forecast]
      operationId: getForecastGrid
      summary: Interpolated forecast for every grid cell in a bbox, all horizons
      description: |
        Values only, keyed by cell `id`; draw them on the polygons from
        `/api/v1/grid/cells`. Every horizon is returned in one response, so switching
        horizon is a client-side swap.

        Cells with no forecast at a horizon (no eligible monitor within 50 km) are
        **omitted** from that horizon, not sent with nulls; draw them as "no data". All
        cells are Stage B, so `method` and `source` are given once on the response.
      parameters:
        - $ref: "#/components/parameters/BboxOptional"
      responses:
        "200":
          description: Grid cell forecasts inside the bbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GridForecast"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/OutOfScope"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/forecast/point:
    get:
      tags: [forecast]
      operationId: getForecastPoint
      summary: Forecast for a location (lat/lon or ZIP), all horizons
      description: |
        Pass **either** `lat` + `lon` **or** `zip` (400 `invalid_query` otherwise).

        The location is snapped to its GEO-02 grid cell, and the cell's forecast is
        returned for every horizon, together with the nearest monitor's own forecast.
        A ZIP is resolved to its ZCTA centroid; no forecast point is created.

        If the cell has no forecast (no eligible monitor within 50 km), the response is
        still 200: `cell.has_forecast` is false, `cell.forecasts` is empty, and
        `cell.nearest_monitor_dist_km` and `nearest_monitor` are filled in.

        The cell distances and `nearest_monitor.distance_km` intentionally differ: the
        cell's are measured from the centroid to monitors Stage B can use (`v2` or
        `persistence`), while `nearest_monitor` is the physically nearest monitor of any
        source, measured from the query location. It can be a `fallback` monitor closer
        than any monitor the cell uses.
      parameters:
        - name: lat
          in: query
          description: Latitude, WGS84 decimal degrees. Required with `lon`.
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          description: Longitude, WGS84 decimal degrees. Required with `lat`.
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: zip
          in: query
          description: 5-digit ZIP code (Census ZCTA).
          schema: { type: string, pattern: "^[0-9]{5}$" }
      responses:
        "200":
          description: Cell and nearest-monitor forecasts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointForecast"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/OutOfScope"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/forecast/monitors:
    get:
      tags: [forecast]
      operationId: getForecastMonitors
      summary: Model forecasts at AirNow monitors, all horizons
      description: |
        Stage A forecast points only (AirNow monitors, `kind = 'monitor'`), each with its
        forecast for every horizon. `nearest_monitor_dist_km` is always 0. A `fallback`
        source means the monitor had no reading in the last 6 h; show it as lower
        confidence.
      parameters:
        - $ref: "#/components/parameters/BboxOptional"
      responses:
        "200":
          description: Monitor forecasts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorForecastCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/OutOfScope"
        "503":
          $ref: "#/components/responses/ForecastUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/fires/active:
    get:
      tags: [fires]
      operationId: getActiveFires
      summary: VIIRS SNPP fire detections from the last 72 hours
      description: |
        Raw FIRMS VIIRS SNPP detections (one feature per pixel) with `detected_at` in
        `[window_start, window_end)`. Same satellite and 72 h window as the model's fire
        features; v1 ingests no other satellite (PM-03, DATA-06).
        All confidence levels are returned; **`confidence = "low"` detections must be
        shown as low confidence**.
      parameters:
        - $ref: "#/components/parameters/BboxOptional"
      responses:
        "200":
          description: Fire detections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireDetectionCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/OutOfScope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/observations/pm25/latest:
    get:
      tags: [observations]
      operationId: getLatestPm25
      summary: Latest PM2.5 reading per outdoor sensor (at most 2 hours old)
      description: |
        One feature per sensor: its most recent hourly reading, if `valid_at` is at most
        2 h before `generated_at`. Included readings:

        - AirNow: `correction = regulatory`.
        - PurpleAir: `correction = purpleair_barkjohn` and `qa_flag = ok` only.
        - Outdoor sensors only.
      parameters:
        - $ref: "#/components/parameters/BboxOptional"
      responses:
        "200":
          description: Latest readings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/OutOfScope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Active model, latest forecast cycle, data freshness and the AQI legend
      responses:
        "200":
          description: Service metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/health:
    get:
      tags: [meta]
      operationId: getHealthV1
      summary: Liveness probe
      responses:
        "200":
          $ref: "#/components/responses/Health"
        "500":
          $ref: "#/components/responses/InternalError"

  /health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Liveness probe (root alias, kept for existing deploy checks)
      responses:
        "200":
          $ref: "#/components/responses/Health"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    BboxOptional:
      name: bbox
      in: query
      required: false
      description: "`minLon,minLat,maxLon,maxLat` (WGS84, GeoJSON order). Clipped to California; defaults to all of it."
      schema:
        $ref: "#/components/schemas/BboxParam"
      example: "-122.95,39.40,-121.50,40.10"

  responses:
    BadRequest:
      description: "Invalid parameters. `code` is `invalid_query` or `invalid_bbox`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OutOfScope:
      description: |
        Not found. `code` is `out_of_scope` (location or bbox outside California) or
        `zip_not_found`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForecastUnavailable:
      description: "No current forecast cycle exists. `code` is `forecast_unavailable`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: "Unexpected server error. `code` is `internal_error`; `message` never contains a stack trace."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Health:
      description: Service is up.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Health"

  schemas:
    # ---------- primitives ----------
    UtcTimestamp:
      type: string
      format: date-time
      pattern: "Z$"
      description: ISO-8601 in UTC with a `Z` suffix.
      examples: ["2024-07-27T18:00:00Z"]
    HorizonHours:
      type: integer
      enum: [1, 3, 6, 12, 24]
    Pm25:
      type: number
      minimum: 0
      description: PM2.5 concentration in µg/m³, truncated (not rounded) to 0.1, the value `aqi_category` is binned from.
    DistanceKm:
      type: number
      minimum: 0
      description: Great-circle distance in km, rounded to 0.1.
    BboxParam:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]+)?(,-?[0-9]+(\\.[0-9]+)?){3}$"
    Bbox:
      type: array
      description: "[minLon, minLat, maxLon, maxLat]"
      items: { type: number }
      minItems: 4
      maxItems: 4
    LatLon:
      type: object
      required: [lat, lon]
      additionalProperties: false
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
    ForecastPointId:
      type: string
      minLength: 1
      description: |
        `forecast_points.id`. Opaque: compare it, never parse it. Grid cells look like
        `grid-ca-epsg3310-12500m-r+000015-c-000013-p00` (GEO-02); monitor points are not
        UUIDs either.
    GridKey:
      type: string
      description: Identifies the GEO-02 grid generation; changes when the grid is regenerated.
      examples: [grid-ca-epsg3310-12500m]
    AqsCode:
      type: string
      pattern: "^[0-9A-Z]{9}$"
      description: Normalized 9-character AQS site code, e.g. `060070008`.

    # ---------- AQI ----------
    AqiCategory:
      type: string
      enum: [good, moderate, unhealthy_sensitive, unhealthy, very_unhealthy, hazardous]
      description: |
        EPA PM2.5 AQI category of `pm25` (table in `aqi_table_version`, labels and colors in
        `/meta`). Computed at read time from the hourly value, so it is an indicator, not an
        official 24 h / NowCast AQI.
    AqiTableVersion:
      type: string
      examples: [epa-2024]
    AqiCategoryInfo:
      type: object
      required: [key, label, color, pm25_min, pm25_max]
      additionalProperties: false
      properties:
        key: { $ref: "#/components/schemas/AqiCategory" }
        label: { type: string, examples: ["Unhealthy for Sensitive Groups"] }
        color: { type: string, pattern: "^#[0-9A-F]{6}$" }
        pm25_min: { type: number, description: "Inclusive lower bound, µg/m³, applied to `pm25` as returned (truncated to 0.1)." }
        pm25_max: { type: [number, "null"], description: "Inclusive upper bound, µg/m³; null for the top category." }

    # ---------- forecasts ----------
    ForecastMethod:
      type: string
      enum: [model, interpolated]
      description: "`model`: predicted at a monitor (Stage A). `interpolated`: IDW from monitors (Stage B)."
    ForecastSource:
      type: string
      enum: [v2, persistence, fallback, idw]
      description: |
        How the value was made (`forecasts.source`). `v2`, `persistence`: model at a monitor.
        `fallback`: the monitor had no recent reading; lower confidence. `idw`: interpolated.
    ForecastEnvelope:
      type: object
      description: Fields every forecast response carries.
      required: [issued_at, model_key, aqi_table_version]
      properties:
        issued_at:
          $ref: "#/components/schemas/UtcTimestamp"
          description: Top of the UTC hour the forecast cycle was issued for.
        model_key:
          type: string
          description: "`model_versions.model_key`, e.g. `baseline_v2/1.0.0`."
        aqi_table_version:
          $ref: "#/components/schemas/AqiTableVersion"
    ForecastValue:
      type: object
      description: One horizon of a forecast.
      required: [horizon_hours, target_time, pm25, aqi_category, method, source, nearest_monitor_dist_km]
      additionalProperties: false
      properties:
        horizon_hours: { $ref: "#/components/schemas/HorizonHours" }
        target_time:
          $ref: "#/components/schemas/UtcTimestamp"
          description: "`issued_at + horizon_hours`."
        pm25: { $ref: "#/components/schemas/Pm25" }
        aqi_category: { $ref: "#/components/schemas/AqiCategory" }
        method: { $ref: "#/components/schemas/ForecastMethod" }
        source: { $ref: "#/components/schemas/ForecastSource" }
        nearest_monitor_dist_km:
          $ref: "#/components/schemas/DistanceKm"
          description: |
            0 at a monitor. For a cell, the distance from its centroid to the nearest monitor
            Stage B used (`v2` or `persistence`; `fallback` monitors never feed a cell).
            Above `/meta` `low_confidence_dist_km` (25) means lower confidence.
    MonitorForecastValue:
      allOf:
        - $ref: "#/components/schemas/ForecastValue"
        - properties:
            method: { const: model }
            source: { enum: [v2, persistence, fallback] }
            nearest_monitor_dist_km: { const: 0 }

    GridCellCollection:
      type: object
      required: [type, grid_key, cell_size_m, bbox, cell_count, features]
      additionalProperties: false
      properties:
        type: { const: FeatureCollection }
        grid_key: { $ref: "#/components/schemas/GridKey" }
        cell_size_m: { const: 12500 }
        bbox:
          $ref: "#/components/schemas/Bbox"
          description: The bbox after clipping to California.
        cell_count: { type: integer, minimum: 0 }
        features:
          type: array
          items: { $ref: "#/components/schemas/GridCellFeature" }
    GridCellFeature:
      type: object
      required: [type, geometry, properties]
      additionalProperties: false
      properties:
        type: { const: Feature }
        geometry: { $ref: "#/components/schemas/PolygonGeometry" }
        properties:
          type: object
          required: [id]
          additionalProperties: false
          properties:
            id: { $ref: "#/components/schemas/ForecastPointId" }

    GridForecast:
      allOf:
        - $ref: "#/components/schemas/ForecastEnvelope"
        - type: object
          required: [grid_key, method, source, bbox, horizons]
          properties:
            grid_key: { $ref: "#/components/schemas/GridKey" }
            method: { const: interpolated }
            source: { const: idw }
            bbox:
              $ref: "#/components/schemas/Bbox"
              description: The bbox after clipping to California.
            horizons:
              type: array
              description: One entry per horizon, ordered 1, 3, 6, 12, 24.
              minItems: 5
              maxItems: 5
              items: { $ref: "#/components/schemas/GridHorizon" }
      unevaluatedProperties: false
    GridHorizon:
      type: object
      required: [horizon_hours, target_time, cells]
      additionalProperties: false
      properties:
        horizon_hours: { $ref: "#/components/schemas/HorizonHours" }
        target_time:
          $ref: "#/components/schemas/UtcTimestamp"
          description: "`issued_at + horizon_hours`."
        cells:
          type: array
          description: Cells with a forecast at this horizon. A cell from `/grid/cells` that is missing here has no forecast.
          items: { $ref: "#/components/schemas/GridCellValue" }
    GridCellValue:
      type: object
      required: [id, pm25, aqi_category, nearest_monitor_dist_km]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ForecastPointId" }
        pm25: { $ref: "#/components/schemas/Pm25" }
        aqi_category: { $ref: "#/components/schemas/AqiCategory" }
        nearest_monitor_dist_km: { $ref: "#/components/schemas/DistanceKm" }

    MonitorForecastCollection:
      allOf:
        - $ref: "#/components/schemas/ForecastEnvelope"
        - type: object
          required: [type, features]
          properties:
            type: { const: FeatureCollection }
            features:
              type: array
              items: { $ref: "#/components/schemas/MonitorForecastFeature" }
      unevaluatedProperties: false
    MonitorForecastFeature:
      type: object
      required: [type, geometry, properties]
      additionalProperties: false
      properties:
        type: { const: Feature }
        geometry: { $ref: "#/components/schemas/PointGeometry" }
        properties:
          type: object
          required: [forecast_point_id, aqs_code, name, forecasts]
          additionalProperties: false
          properties:
            forecast_point_id: { $ref: "#/components/schemas/ForecastPointId" }
            aqs_code: { $ref: "#/components/schemas/AqsCode" }
            name: { type: [string, "null"] }
            forecasts:
              type: array
              description: One per horizon, ordered 1, 3, 6, 12, 24.
              items: { $ref: "#/components/schemas/MonitorForecastValue" }

    PointForecast:
      allOf:
        - $ref: "#/components/schemas/ForecastEnvelope"
        - type: object
          required: [query, cell, nearest_monitor]
          properties:
            query:
              type: object
              required: [lat, lon, zip, zip_area_km2]
              additionalProperties: false
              description: The resolved query location (the ZCTA centroid for a ZIP).
              properties:
                lat: { type: number }
                lon: { type: number }
                zip: { type: [string, "null"] }
                zip_area_km2:
                  type: [number, "null"]
                  description: Set for ZIP queries. The UI warns when the ZIP is large (centroid can be 20+ km from a house).
            cell:
              type: object
              required: [forecast_point_id, centroid, has_forecast, no_forecast_reason, nearest_monitor_dist_km, forecasts]
              additionalProperties: false
              properties:
                forecast_point_id:
                  $ref: "#/components/schemas/ForecastPointId"
                  description: The cell's id, the same as `id` in `/grid/cells` and `/forecast/grid`.
                centroid: { $ref: "#/components/schemas/LatLon" }
                has_forecast: { type: boolean }
                no_forecast_reason:
                  type: [string, "null"]
                  enum: [no_monitor_within_50km, null]
                nearest_monitor_dist_km:
                  description: |
                    Distance from the centroid to the nearest monitor Stage B can use this
                    cycle (`v2` or `persistence`), with no 50 km limit, so it is set when
                    `has_forecast` is false too ("nearest monitor 61 km away"). Null only if no
                    monitor is usable.
                  oneOf:
                    - $ref: "#/components/schemas/DistanceKm"
                    - type: "null"
                forecasts:
                  type: array
                  description: One per horizon, ordered 1, 3, 6, 12, 24. Empty when `has_forecast` is false.
                  items:
                    allOf:
                      - $ref: "#/components/schemas/ForecastValue"
                      - properties:
                          method: { const: interpolated }
                          source: { const: idw }
            nearest_monitor:
              description: |
                Physically nearest forecast-point monitor to the query location, of any source;
                null only if no monitor has a current forecast. It can be a `fallback` monitor
                that no cell uses, so `distance_km` can be smaller than every cell distance.
                Show `forecasts[].source = fallback` as lower confidence.
              oneOf:
                - type: "null"
                - type: object
                  required: [forecast_point_id, aqs_code, name, location, distance_km, forecasts]
                  additionalProperties: false
                  properties:
                    forecast_point_id: { $ref: "#/components/schemas/ForecastPointId" }
                    aqs_code: { $ref: "#/components/schemas/AqsCode" }
                    name: { type: [string, "null"] }
                    location: { $ref: "#/components/schemas/LatLon" }
                    distance_km:
                      $ref: "#/components/schemas/DistanceKm"
                      description: Distance from the query location to this monitor.
                    forecasts:
                      type: array
                      description: One per horizon, ordered 1, 3, 6, 12, 24.
                      items: { $ref: "#/components/schemas/MonitorForecastValue" }
      unevaluatedProperties: false

    # ---------- fires ----------
    FireDetectionCollection:
      type: object
      required: [type, generated_at, window_hours, window_start, window_end, detection_count, features]
      additionalProperties: false
      properties:
        type: { const: FeatureCollection }
        generated_at: { $ref: "#/components/schemas/UtcTimestamp" }
        window_hours: { const: 72 }
        window_start: { $ref: "#/components/schemas/UtcTimestamp" }
        window_end: { $ref: "#/components/schemas/UtcTimestamp" }
        detection_count: { type: integer, minimum: 0 }
        features:
          type: array
          items: { $ref: "#/components/schemas/FireDetectionFeature" }
    FireDetectionFeature:
      type: object
      required: [type, geometry, properties]
      additionalProperties: false
      properties:
        type: { const: Feature }
        geometry:
          $ref: "#/components/schemas/PointGeometry"
          description: Pixel centre. A VIIRS pixel is ~375 m across.
        properties:
          type: object
          required: [detection_id, detected_at, satellite, product, confidence, confidence_raw, frp_mw, daynight]
          additionalProperties: false
          properties:
            detection_id: { type: string, format: uuid }
            detected_at:
              $ref: "#/components/schemas/UtcTimestamp"
              description: Satellite overpass time.
            satellite:
              enum: [VIIRS_SNPP]
              description: v1 only ingests VIIRS SNPP. Another satellite would be a new enum value (additive).
            product: { enum: [URT, RT, NRT, SP] }
            confidence:
              enum: [low, nominal, high]
              description: Normalized confidence. **Render `low` as low confidence** (e.g. hollow or faded marker).
            confidence_raw:
              enum: [l, n, h]
              description: "As reported by FIRMS for VIIRS: `l` / `n` / `h`."
            frp_mw:
              type: [number, "null"]
              minimum: 0
              description: Fire radiative power, MW.
            daynight: { enum: [D, N, null] }

    # ---------- observations ----------
    ObservationCollection:
      type: object
      required: [type, generated_at, max_age_hours, aqi_table_version, features]
      additionalProperties: false
      properties:
        type: { const: FeatureCollection }
        generated_at: { $ref: "#/components/schemas/UtcTimestamp" }
        max_age_hours: { const: 2 }
        aqi_table_version: { $ref: "#/components/schemas/AqiTableVersion" }
        features:
          type: array
          items: { $ref: "#/components/schemas/ObservationFeature" }
    ObservationFeature:
      type: object
      required: [type, geometry, properties]
      additionalProperties: false
      properties:
        type: { const: Feature }
        geometry: { $ref: "#/components/schemas/PointGeometry" }
        properties:
          type: object
          required: [monitor_id, provider, station_code, name, valid_at, pm25, aqi_category, correction]
          additionalProperties: false
          properties:
            monitor_id:
              type: string
              format: uuid
              description: "`monitors.id`."
            provider:
              enum: [airnow, purpleair]
              description: Network the reading comes from.
            station_code:
              type: string
              description: AQS code for AirNow, `sensor_index` for PurpleAir.
            name: { type: [string, "null"] }
            valid_at:
              $ref: "#/components/schemas/UtcTimestamp"
              description: Start of the hour the reading averages.
            pm25: { $ref: "#/components/schemas/Pm25" }
            aqi_category: { $ref: "#/components/schemas/AqiCategory" }
            correction:
              enum: [regulatory, purpleair_barkjohn]
              description: "`regulatory` for AirNow; PurpleAir values are Barkjohn-corrected."

    # ---------- meta ----------
    Meta:
      type: object
      required:
        - generated_at
        - api_version
        - model_key
        - model_status
        - latest_issued_at
        - forecast_age_minutes
        - forecast_stale_after_minutes
        - forecast_stale
        - horizons
        - grid_key
        - mock_mode
        - low_confidence_dist_km
        - max_interpolation_dist_km
        - aqi_category_label
        - aqi_table_version
        - aqi_categories
        - sources
      additionalProperties: false
      properties:
        generated_at: { $ref: "#/components/schemas/UtcTimestamp" }
        api_version: { const: v1 }
        model_key:
          type: [string, "null"]
          description: Active production `model_key`; null before the first model is promoted.
        model_status: { enum: [production, shadow, retired, null] }
        latest_issued_at:
          description: "`issued_at` of the newest forecast cycle; null if none exists."
          oneOf:
            - $ref: "#/components/schemas/UtcTimestamp"
            - type: "null"
        forecast_age_minutes: { type: [integer, "null"], minimum: 0 }
        forecast_stale_after_minutes:
          type: integer
          description: "PROVISIONAL: threshold not decided yet."
        forecast_stale: { type: boolean }
        horizons:
          type: array
          items: { $ref: "#/components/schemas/HorizonHours" }
        grid_key:
          $ref: "#/components/schemas/GridKey"
          description: The current grid; refetch `/grid/cells` when it differs from the cached one.
        mock_mode:
          type: boolean
          description: |
            True when the API serves the PM-02 fixtures instead of real data (API-01
            `MOCK_MODE=true`). The UI shows a "Demo data" badge so sample data is never
            mistaken for a live forecast. True in the fixtures, since they are sample data.
        low_confidence_dist_km:
          type: number
          description: Show a cell forecast as lower confidence when its `nearest_monitor_dist_km` is above this.
          examples: [25]
        max_interpolation_dist_km:
          type: number
          description: Stage B radius. A cell with no usable monitor within it has no forecast.
          examples: [50]
        aqi_category_label:
          type: string
          description: Display label for `aqi_category` on every screen.
          examples: ["AQI category (hourly PM2.5)"]
        aqi_table_version: { $ref: "#/components/schemas/AqiTableVersion" }
        aqi_categories:
          type: array
          description: Legend, in order from `good` to `hazardous`.
          minItems: 6
          maxItems: 6
          items: { $ref: "#/components/schemas/AqiCategoryInfo" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceFreshness" }
    SourceFreshness:
      type: object
      required: [source, last_success_at, latest_data_at, age_minutes, stale_after_minutes, stale]
      additionalProperties: false
      properties:
        source: { enum: [airnow, purpleair, firms, nws_obs] }
        last_success_at:
          description: Finish time of the newest successful ingestion run.
          oneOf:
            - $ref: "#/components/schemas/UtcTimestamp"
            - type: "null"
        latest_data_at:
          description: Newest data timestamp ingested (`ingestion_runs.watermark`).
          oneOf:
            - $ref: "#/components/schemas/UtcTimestamp"
            - type: "null"
        age_minutes:
          type: [integer, "null"]
          minimum: 0
          description: "`generated_at - latest_data_at`."
        stale_after_minutes:
          type: integer
          description: "PROVISIONAL: per-source thresholds not decided yet."
        stale: { type: boolean }

    Health:
      type: object
      required: [status, environment]
      additionalProperties: false
      properties:
        status: { const: ok }
        environment: { type: string }

    # ---------- shared ----------
    PointGeometry:
      type: object
      required: [type, coordinates]
      additionalProperties: false
      properties:
        type: { const: Point }
        coordinates:
          type: array
          description: "[lon, lat], WGS84, 5 decimals."
          prefixItems:
            - { type: number, minimum: -180, maximum: 180 }
            - { type: number, minimum: -90, maximum: 90 }
          minItems: 2
          maxItems: 2
    PolygonGeometry:
      type: object
      required: [type, coordinates]
      additionalProperties: false
      properties:
        type: { const: Polygon }
        coordinates:
          type: array
          description: "One exterior ring, counter-clockwise, closed, of [lon, lat] (WGS84, 5 decimals)."
          minItems: 1
          maxItems: 1
          items:
            type: array
            minItems: 4
            items:
              type: array
              prefixItems:
                - { type: number, minimum: -180, maximum: 180 }
                - { type: number, minimum: -90, maximum: 90 }
              minItems: 2
              maxItems: 2
    Error:
      type: object
      description: The only error shape. `code` is stable and machine-readable; `message` is for people.
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          enum:
            - invalid_query
            - invalid_bbox
            - out_of_scope
            - zip_not_found
            - forecast_unavailable
            - not_found
            - internal_error
        message: { type: string }
